name: Sync from rosencrantz-coin

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # Every 15 minutes

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the-lab
        uses: actions/checkout@v4

      - name: Checkout rosencrantz-coin
        uses: actions/checkout@v4
        with:
          repository: franklinbaldo/rosencrantz-coin
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeXML
        run: sudo apt-get update -qq && sudo apt-get install -y -qq latexml

      - name: Run sync script
        run: python tools/sync_to_blog.py source .

      - name: Record source provenance
        run: |
          SOURCE_SHA=$(git -C source rev-parse HEAD)
          SOURCE_COMMITTED_AT=$(git -C source show -s --format=%cI HEAD)
          python3 - "$SOURCE_SHA" "$SOURCE_COMMITTED_AT" <<'PY'
          import json
          import sys
          from pathlib import Path

          sha, committed_at = sys.argv[1:3]
          provenance = {
              "source_repository": "franklinbaldo/rosencrantz-coin",
              "source_sha": sha,
              "source_committed_at": committed_at,
          }
          Path("content").mkdir(exist_ok=True)
          Path("content/provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Clean up checkout
        run: rm -rf source

      - name: Deliver journalist GitHub Issues
        if: hashFiles('journalist/gh/outbox/*.json') != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          TARGET_REPO="franklinbaldo/rosencrantz-coin"
          for f in journalist/gh/outbox/*.json; do
            [ -f "$f" ] || continue
            ACTION=$(python3 -c "import json,sys; print(json.load(open('$f'))['action'])")
            if [ "$ACTION" = "issue_create" ]; then
              TITLE=$(python3 -c "import json; d=json.load(open('$f')); print(d['title'])")
              BODY=$(python3 -c "import json; d=json.load(open('$f')); print(d.get('body',''))")
              LABELS=$(python3 -c "import json; d=json.load(open('$f')); print(','.join(d.get('labels',[])))")
              gh issue create --repo "$TARGET_REPO" --title "$TITLE" --body "$BODY" --label "$LABELS" && rm "$f"
            elif [ "$ACTION" = "issue_comment" ]; then
              NUM=$(python3 -c "import json; d=json.load(open('$f')); print(d['issue_number'])")
              BODY=$(python3 -c "import json; d=json.load(open('$f')); print(d.get('body',''))")
              gh issue comment "$NUM" --repo "$TARGET_REPO" --body "$BODY" && rm "$f"
            fi
          done

      # A main exige head atualizado antes do merge, e a regra tambem vale para
      # push: o conteudo sincronizado vai por PR em auto-merge.
      - name: Commit and open PR
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Lab Sync Bot"
          git config user.email "sync@rosencrantz-lab.dev"
          git add content/
          git add journalist/gh/outbox/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ) from rosencrantz-coin"
          BRANCH=automation/sync-rosencrantz
          git checkout -B "$BRANCH"
          git push -f origin "$BRANCH"
          NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            CORPO="Conteudo sincronizado do rosencrantz-coin pelo workflow Sync."
            URL=$(gh pr create --base main --head "$BRANCH" --title "sync from rosencrantz-coin" --body "$CORPO")
            NUM="${URL##*/}"
          fi
          gh pr merge "$NUM" --auto --squash
          echo "pr=$NUM" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # O merge do auto-merge tambem e feito com o GITHUB_TOKEN e tambem nao
      # dispara workflow, entao o deploy segue precisando de disparo explicito
      # depois que o PR entra.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.commit.outputs.pr }}
        run: |
          for _ in $(seq 1 40); do
            ESTADO=$(gh pr view "$PR" --json state --jq .state)
            [ "$ESTADO" = MERGED ] && break
            sleep 15
          done
          if [ "$ESTADO" != MERGED ]; then
            echo "::warning::PR #$PR nao mergeou em 10 min."
            exit 0
          fi
          gh workflow run deploy.yml
