name: Journalist Heartbeat

on:
  schedule:
    - cron: "0,30 * * * *"  # Every 30 minutes
  workflow_dispatch:

concurrency:
  group: journalist-heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Journalist heartbeat
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: python tools/journalist-heartbeat.py

      # A main exige head atualizado antes do merge, e a regra tambem vale para
      # push: o estado da sessao vai por PR em auto-merge.
      - name: Commit session state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journalist/session.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "journalist heartbeat: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BRANCH=automation/journalist-heartbeat
          git checkout -B "$BRANCH"
          git push -f origin "$BRANCH"
          NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$NUM" ]; then
            CORPO="Estado da sessao do journalist, gerado pelo workflow Journalist Heartbeat."
            URL=$(gh pr create --base main --head "$BRANCH" --title "journalist heartbeat" --body "$CORPO")
            NUM="${URL##*/}"
          fi
          gh pr merge "$NUM" --auto --squash
